url: https://hypertidy.github.io/polymer/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#5142A5"
    secondary: "#4C7280"
    success: "#1A8A78"
    info: "#287D9B"
    warning: "#C88324"
    danger: "#C65359"
    body-bg: "#FFFFFF"
    body-color: "#1B2533"
    headings-color: "#1B2533"
    link-color: "#4535A0"
  assets: pkgdown

navbar:
  bg: primary
  type: dark
  structure:
    left: [intro, reference, articles]
    right: [search, github]
  components:
    intro:
      text: Overview
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    github:
      icon: fab fa-github
      href: https://github.com/hypertidy/polymer

home:
  title: polymer
  description: Polygon overlays, built on one shared triangle mesh
  strip_header: false

reference:
  - title: Build an overlay
    contents:
      - polymer
  - title: Explore and extract
    contents:
      - fuse
      - layer_n
      - plot.polymer
      - print.polymer
  - title: Example data
    contents:
      - ABC
      - field

articles:
  - title: Workflows
    contents:
      - identity-nary
  - title: Background
    contents:
      - articles/overlay-robustness
